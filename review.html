<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Write a review - CineScope Independent</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <nav class="navbar" aria-label="Main menu">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="navbar-brand logo d-inline-flex align-items-center"><img src="images/logo.jpeg" alt="" class="logo-icon">CineScope</a>
      <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#mainMenu" aria-controls="mainMenu" aria-expanded="false" aria-label="Toggle menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse w-100" id="mainMenu">
        <ul class="navbar-nav ms-auto text-end">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="films.html">Films</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="review.html">Write a review</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>

  <main class="container">
    <nav aria-label="Breadcrumb" class="breadcrumb-nav">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="index.html">Home</a></li>
      <li class="breadcrumb-item active" aria-current="page">Write a review</li>
    </ol>
  </nav>
    <section class="intro">
      <h1>Write a review</h1>
      <p>For CineScope staff critics. Choose a film, give it a rating and write your review.</p>
    </section>

    <section class="row">
      <div class="col-lg-8">

        <form class="film-card p-4" action="#" method="post">

          <div class="mb-3">
            <label for="critic" class="form-label">Your name</label>
            <input type="text" id="critic" name="critic" class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="film" class="form-label">Film</label>
            <select id="film" name="film" class="form-select" required>
              <option value="" selected disabled>Choose a film</option>
              <option value="desert-sun">Desert Sun</option>
              <option value="midnight-run">Midnight Run</option>
              <option value="neon-city">The Neon City</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="rating" class="form-label">Star rating (out of 5)</label>
            <select id="rating" name="rating" class="form-select" required>
              <option value="" selected disabled>Choose a rating</option>
              <option value="5.0">5.0</option>
              <option value="4.5">4.5</option>
              <option value="4.0">4.0</option>
              <option value="3.5">3.5</option>
              <option value="3.0">3.0</option>
              <option value="2.5">2.5</option>
              <option value="2.0">2.0</option>
              <option value="1.5">1.5</option>
              <option value="1.0">1.0</option>
              <option value="0.5">0.5</option>
            </select>
          </div>

          <div class="mb-4">
            <label for="text" class="form-label">Review</label>
            <textarea id="text" name="text" class="form-control" rows="10" required></textarea>
          </div>

          <button type="submit" class="btn btn-gold">Publish review</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="mb-0">CineScope Independent - reviews of independent films</p>
    </div>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
